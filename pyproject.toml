[project]
name = "life-ledger"
version = "0.1.0"
description = "Local-first CLI personal balance tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.2.3",
    "rich>=13.0",
]

[project.scripts]
life-ledger = "life_ledger.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/life_ledger"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "RUF"]
ignore = ["B008"]  # do not perform function calls in argument defaults (Click uses this)

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["life_ledger"]
omit = ["tests/*"]
